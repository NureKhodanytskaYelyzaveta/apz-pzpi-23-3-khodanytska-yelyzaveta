version: '3.8'

services:
  flask-backend:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./library.db:/app/library.db
    environment:
      - DATABASE_URL=sqlite:///app/library.db
      
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - flask-backend