{% extends 'core/base.html' %}

{% block title %}Вхід в систему{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        min-height: calc(100vh - 76px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
    }
    
    .login-card {
        background: white;
        border-radius: 30px;
        padding: 3rem 2.5rem;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        max-width: 450px;
        width: 100%;
        animation: slideUp 0.5s ease;
    }
    
    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .login-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }
    
    .login-icon {
        width: 100px;
        height: 100px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    
    .login-icon i {
        font-size: 50px;
        color: white;
    }
    
    .login-header h1 {
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 0.5rem;
    }
    
    .login-header p {
        color: #6b7280;
        font-size: 0.95rem;
    }
    
    .form-control-custom {
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        padding: 14px 18px;
        font-size: 1rem;
        transition: all 0.3s;
        margin-bottom: 1.5rem;
    }
    
    .form-control-custom:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        outline: none;
    }
    
    .form-label-custom {
        font-weight: 600;
        color: #374151;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
    }
    
    .btn-login {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        color: white;
        font-weight: 600;
        padding: 14px;
        border-radius: 12px;
        width: 100%;
        font-size: 1rem;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    
    .alert-error {
        background: #fee2e2;
        border: none;
        color: #991b1b;
        padding: 12px 16px;
        border-radius: 10px;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
    }
    
    .info-box {
        background: #f3f4f6;
        border-radius: 10px;
        padding: 1rem;
        margin-top: 1.5rem;
        text-align: center;
    }
    
    .info-box small {
        color: #6b7280;
        display: block;
        margin: 0.25rem 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">
                <i class="bi bi-book-half"></i>
            </div>
            <h1>Бібліотека</h1>
            <p>Введіть дані для входу в систему</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="alert-error">
                <i class="bi bi-exclamation-circle me-2"></i>
                Невірний email або пароль
            </div>
            {% endif %}
            
            <label class="form-label-custom">
                <i class="bi bi-envelope me-2"></i>Email
            </label>
            <input 
                type="email" 
                name="email" 
                class="form-control form-control-custom" 
                placeholder="your@email.com"
                required
                autofocus
            >
            
            <label class="form-label-custom">
                <i class="bi bi-lock me-2"></i>Пароль
            </label>
            <input 
                type="password" 
                name="password" 
                class="form-control form-control-custom" 
                placeholder="••••••••"
                required
            >
            
            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>Увійти
            </button>
        </form>
    </div>
</div>
{% endblock %}
